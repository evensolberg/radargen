# FR-76 (D-61): one trim for every CSV and --rings value. `str::trim` strips
# whitespace only, so a stray byte-order mark or zero-width space survives it.
disallowed-methods = [
    { path = "str::trim", reason = "FR-76 (D-61): use radargen::trim" },
    { path = "str::trim_start", reason = "FR-76 (D-61): use radargen::trim" },
    { path = "str::trim_end", reason = "FR-76 (D-61): use radargen::trim" },
]

# png 0.18 depends on miniz_oxide 0.8 directly and 0.9 through flate2;
# neither is ours to unify (rg-42m).
allowed-duplicate-crates = ["miniz_oxide"]

# --config's key names (FR-91), which --help lists in prose: clap prints a
# doc comment verbatim, so backticks would reach the user. ".." keeps
# clippy's defaults.
doc-valid-idents = ["..", "unplotted_rings", "legend_columns"]

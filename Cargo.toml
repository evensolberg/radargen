[package]
name = "radargen"
version = "1.28.0"
edition = "2024"
rust-version = "1.97"
description = "Render a technology radar from CSV to a self-contained HTML page, a PNG image, an SVG file or a PDF"
license = "GPL-3.0-or-later"
repository = "https://github.com/evensolberg/radargen"
readme = "README.md"
keywords = ["radar", "technology-radar", "svg", "visualisation", "cli"]
categories = ["command-line-utilities", "visualization"]
# What a crate on crates.io holds: the source, the fonts and the two sample
# files the binary writes (--create-palette, --create-config), not the
# repository's docs, crumbs, goldens or tooling. Anchored with a leading
# slash: a bare README.md would match one in any folder.
include = [
    "/src/**",
    "/assets/**",
    "/docs/product/palette.sample.css",
    "/docs/product/config.sample.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
harfrust = "0.12"
same-file = "1"
serde = "1.0.229"
serde_json = "1.0.154"
# FR-108's edit distance; already built for clap's suggestions.
strsim = "0.11.1"
tempfile = "3"
thiserror = "2.0.21"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# PNG export (FR-55). Only `text`: no system fonts (NFR-7), no raster
# image decoders, no svgz. usvg sees only the font database the emitter
# builds.
resvg = { version = "0.49", default-features = false, features = ["text"] }
# SVG export (D-88): glyph outlines, read only by text.rs. The version usvg
# reads fonts with, sharing read-fonts with harfrust, so no second copy
# builds (rg-v3a).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# FR-91's --config file. Parse only: no writer (display), no order-preserving map.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# -e today's local date (D-58), the one clock read. The system zone, or
# the one TZ names, looked up in the OS's zoneinfo, or on Windows in the
# bundled database; no fat tz data or inlining tuning.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
# PDF export (FR-110, D-103): written directly from the document, so no
# usvg in its path; no SVG-to-PDF crate is on usvg 0.48.
pdf-writer = "0.15"
# The PDF's embedded Inter subsets. No variable-font support: the vendored
# faces are static, and the feature would pull a second skrifa.
subsetter = { version = "0.2", default-features = false }
# The PDF's font stream (FlateDecode). 0.9 is the version flate2 already
# builds, so no third copy; png's direct 0.8 is the duplicate rg-42m
# tracks, and it goes when png moves to 0.9.
miniz_oxide = "0.9"

[dev-dependencies]
sha2 = "0.11.1"
roxmltree = "0.21"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# SC-30's render oracle: an independent pure-Rust PDF rasteriser, so the
# PDF is checked by a reading of the format that is not ours. Its second
# skrifa, read-fonts and fearless_simd are dev-only, which
# clippy::multiple_crate_versions does not count.
hayro = "0.8"
# Reads the PDF's text and structure back in tests (SC-30).
lopdf = { version = "0.46", default-features = false }

# Architecture §1: no unsafe anywhere, and clippy's pedantic, nursery and
# cargo groups are errors rather than advice. The lints are declared here,
# not as crate attributes, so the lib, binary, tests and examples share one
# gate, and CI's `cargo clippy --all-targets -- -D warnings` enforces all
# of it, as does a plain `cargo clippy --all-targets` locally.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
missing_assert_message = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
as_conversions = "deny"

# Rasterising, encoding and decoding in an unoptimised build is many
# times slower; the PNG tests run on three OSes.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
# Shaping too (rg-c9v): every text measure in a test goes through
# harfrust, and a one-character measure costs about 15 times more
# unoptimised, so text-heavy tests spent most of their time here.
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
# The PDF render oracle (dev only): hayro draws every PDF page, paper
# pages at twice their size, so an unoptimised build spent most of the
# oracle's time here (about 15% of the suite, PR 21a's simplify pass).
[profile.dev.package.hayro]
opt-level = 3
[profile.dev.package.hayro-interpret]
opt-level = 3
[profile.dev.package.hayro-syntax]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3

[profile.release]
strip = true
lto = true

# The prebuilt binaries on GitHub releases (dist-workspace.toml): the same
# full LTO and stripping as a local release build, so a download matches
# what `cargo install` builds.
[profile.dist]
inherits = "release"

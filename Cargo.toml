[package]
name = "radargen"
version = "0.1.0"
edition = "2024"
description = "Render a technology radar from CSV to a self-contained HTML page, PNG, or SVG"
license = "GPL-3.0-or-later"
repository = "https://github.com/evensolberg/radargen"
readme = "README.md"
keywords = ["radar", "technology-radar", "svg", "visualisation", "cli"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
harfrust = "0.12"
same-file = "1"
serde = "1.0.229"
serde_json = "1.0.152"
tempfile = "3"
thiserror = "2.0.21"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
fontdb = "0.24"
sha2 = "0.11.0"
roxmltree = "0.21"
ttf-parser = "0.25"
html5ever = "0.39"
markup5ever_rcdom = "0.39"

# Architecture §1: no unsafe anywhere, and clippy's pedantic, nursery and
# cargo groups are errors rather than advice. The lints are declared here,
# not as crate attributes, so the lib, binary, tests and examples share one
# gate, and CI's `cargo clippy --all-targets -- -D warnings` enforces all
# of it, as does a plain `cargo clippy --all-targets` locally.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
string_slice = "deny"
unwrap_in_result = "deny"
missing_assert_message = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"
indexing_slicing = "deny"
as_conversions = "deny"

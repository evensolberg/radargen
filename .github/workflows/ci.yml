name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs, with the release as a comment, so a
# moved tag cannot change what runs; Dependabot keeps them current.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Cargo.toml's [lints] denies clippy::pedantic and forbids unsafe_code,
      # so -D warnings is the whole gate (architecture §1).
      - run: cargo clippy --locked --all-targets -- -D warnings

  licenses:
    # NFR-18: every dependency is permissive, checked against deny.toml
    # rather than remembered (architecture §1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses

  test:
    # NFR-13's supported platforms, in its priority order.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml pins, with its components.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Plain `cargo test` also builds the examples and runs doctests.
      - run: cargo test --locked

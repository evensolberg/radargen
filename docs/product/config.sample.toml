# radargen config: a radar's settings, kept beside its CSV.
#
# radargen reads this file when -c names it: radargen -c radar.toml
# Every setting below is commented out, so as written the file changes
# nothing. Delete the "# " in front of a key to use it. A flag on the
# command line overrides its key. A relative path is read from this
# file's folder, wherever you run the command; ~ is not expanded.

# The CSV to read. A CSV named on the command line overrides it.
# input = "radar.csv"

# Where to write the radar. The extension picks the format: .html, .png,
# .svg or .pdf. With no output here, pass -o.
# output = "radar.html"

# A title above the radar. The default is none; a PDF on paper always
# shows one, "Technology Radar" if none is given.
# title = "Technology Radar"

# A second line under the title. {edition} becomes the edition's date, so
# it needs -e YYYY-MM-DD, -e today or the edition key below.
# subtitle = "Created {edition}"

# The rings, outermost first. These are the defaults.
# rings = ["Assess", "Trial", "Adopt", "Retire"]

# Rings whose rows are left off the radar without a warning. The default
# is none.
# unplotted_rings = ["In Use", "Rejected"]

# Shade every other ring faintly, from the centre out, so the rings are
# easier to tell apart: "alternate". "none", the default, draws the ring
# circles only, as the standard radar does. Every format draws it.
# ring_shading = "none"

# The colours for PNG, SVG and PDF: "light", the default, or "dark". Use
# theme or palette, not both.
# theme = "light"

# The width in pixels for PNG, SVG and PDF, from 320 to 10000; the
# height follows. The default is the drawing's own width. A PDF's page is
# 96 pixels to the inch, so 1056 is 11 inches wide; it is not a paper size
# (see paper below).
# width = 1920

# Flow a PNG, SVG or PDF legend into 1 to 4 columns beside the radar,
# breaking only between sectors. The default is 1.
# legend_columns = 1

# How an HTML page's legend starts: "shown", the default, or "hidden".
# legend = "shown"

# What the table lists, on an HTML page and in a full PDF (see pdf):
# "radar", the default, for the rows on the radar, or "all" for every row
# and every named column.
# table = "radar"

# Put a PDF on landscape paper: "letter" or "a4". "none", the default, is
# one page the size of the drawing. Only PDF reads it; on paper, width and
# legend_columns do not apply, and the title is always shown. A full PDF
# (see pdf) is on Letter unless this says "a4"; most of Europe uses "a4".
# paper = "none"

# What a PDF holds: "radar" (the default) is the radar, key and legend;
# "full" adds the items' table (see table) after them, always on paper
# (Letter unless paper is "a4"). Only PDF reads it. A subtitle such as
# "Edition {edition}" puts the edition in every printed page's footer.
# pdf = "radar"

# Colours from a CSS file instead of the built-in themes, in every format.
# Use palette or theme, not both; radargen --create-palette writes one.
# palette = "brand.css"

# The edition's date, which {edition} in output, title or subtitle
# becomes: a date written YYYY-MM-DD, or "today" for the local date.
# edition = "today"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t" aria-describedby="d">
  <title id="t">Where each palette colour is drawn</title>
  <desc id="d">A quarter of a radar and part of its legend, each part labelled with the palette property that colours it. The radar's ground is surface-1; the legend panel is surface-2; the sector heading and item names are text-primary; the ring heading, item details and ring labels are text-muted; ring circles are stroke-ring; the sector's edge lines are stroke-divider; a solid marker is series-1 with an automatic number colour; a hollow marker is filled with marker-hollow and outlined in series-1; the keyboard focus ring is focus.</desc>
  <rect width="760" height="420" fill="#FFFFFF"/>
  <!-- stroke-ring: ring circles, centre at the bottom left -->
  <g fill="none" stroke="#7E858F" stroke-width="1.5">
    <path d="M 340 360 A 300 300 0 0 0 40 60"/>
    <path d="M 265 360 A 225 225 0 0 0 40 135"/>
    <path d="M 190 360 A 150 150 0 0 0 40 210"/>
    <path d="M 115 360 A 75 75 0 0 0 40 285"/>
  </g>
  <!-- stroke-divider: the sector's two edges -->
  <g stroke="#848B96" stroke-width="1.5">
    <line x1="40" y1="360" x2="40" y2="48"/>
    <line x1="40" y1="360" x2="352" y2="360"/>
  </g>
  <!-- text-muted: a ring label at 12 o'clock, haloed in surface-1 -->
  <text x="40" y="102" font-size="13" text-anchor="middle" fill="#585F6B" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Assess</text>
  <!-- series-1: solid markers, outlined in surface-1, numbers in the automatic ink -->
  <circle cx="150" cy="190" r="13" fill="#0072B2" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="150" y="195" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">1</text>
  <circle cx="120" cy="300" r="13" fill="#0072B2" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="120" y="305" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">3</text>
  <!-- marker-hollow inside a hollow marker; text-primary number -->
  <circle cx="225" cy="265" r="12" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
  <text x="225" y="270" font-size="13" font-weight="600" text-anchor="middle" fill="#16191F">2</text>
  <!-- focus: the keyboard focus ring, on marker 3 only -->
  <circle cx="120" cy="300" r="19" fill="none" stroke="#0B5FA5" stroke-width="2.5"/>
  <!-- surface-2: the legend panel -->
  <rect x="420" y="20" width="160" height="130" rx="6" fill="#F4F5F7"/>
  <text x="436" y="48" font-size="15" font-weight="600" fill="#16191F">Tools</text>
  <text x="436" y="72" font-size="12" fill="#585F6B">Adopt</text>
  <circle cx="446" cy="96" r="9" fill="#0072B2"/>
  <text x="446" y="100" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="462" y="100" font-size="13" fill="#16191F">Kafka</text>
  <text x="504" y="100" font-size="12" fill="#585F6B">· New</text>
  <circle cx="446" cy="124" r="8" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
  <text x="446" y="128" font-size="11" font-weight="600" text-anchor="middle" fill="#16191F">2</text>
  <text x="462" y="128" font-size="13" fill="#16191F">Spark</text>
  <!-- labels and leader lines; no two leaders cross, and each ends on its part -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#16191F" stroke="#16191F" stroke-width="1">
    <text x="610" y="40" stroke="none">--surface-2</text>
    <line x1="604" y1="36" x2="572" y2="36"/>
    <text x="610" y="72" stroke="none">--text-primary</text>
    <line x1="604" y1="68" x2="482" y2="44"/>
    <text x="610" y="100" stroke="none">--text-muted</text>
    <line x1="604" y1="96" x2="544" y2="96"/>
    <text x="610" y="172" stroke="none">--surface-1</text>
    <line x1="604" y1="168" x2="332" y2="168"/>
    <text x="610" y="200" stroke="none">--series-1</text>
    <line x1="604" y1="196" x2="158" y2="192"/>
    <text x="610" y="234" stroke="none">--stroke-ring</text>
    <line x1="604" y1="230" x2="315" y2="240"/>
    <text x="610" y="266" stroke="none">--marker-hollow</text>
    <line x1="604" y1="262" x2="232" y2="263"/>
    <text x="610" y="300" stroke="none">--focus</text>
    <line x1="604" y1="296" x2="140" y2="300"/>
    <text x="610" y="396" stroke="none">--stroke-divider</text>
    <line x1="604" y1="392" x2="300" y2="360"/>
  </g>
</svg>
